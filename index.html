<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CloudSketch AWS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header><div><b>CloudSketch AWS</b><span>architecture → infrastructure as code</span></div><div class="actions"><button id="loadExample">Example</button><button id="saveJson">Save JSON</button><label class="button">Load JSON<input id="loadJson" type="file" accept="application/json" hidden></label><button id="exportCode" class="primary">Export code</button></div></header>
  <main>
    <aside><input id="search" placeholder="Search AWS services…"/><div id="palette"></div></aside>
    <section class="workspace"><div class="toolbar"><button id="selectMode" class="active">Select</button><button id="connectMode">Connect</button><button id="deleteSelection">Delete</button><button id="validate">Validate</button><span id="status">Drop a service onto the canvas</span></div><div id="canvas"><svg id="edges"></svg><div id="empty">Drag AWS services here</div></div></section>
    <aside class="inspector"><h3>Properties</h3><div id="properties"><p>Select a resource.</p></div><h3>Validation</h3><div id="issues"><p>Not run yet.</p></div></aside>
  </main>
  <dialog id="codeDialog"><form method="dialog"><div class="dialogHead"><h2>Generated infrastructure</h2><button>×</button></div><div class="tabs"><button type="button" data-format="terraform" class="active">Terraform</button><button type="button" data-format="cdk">AWS CDK</button><button type="button" id="copyCode">Copy</button><button type="button" id="downloadCode">Download</button></div><pre><code id="code"></code></pre></form></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
